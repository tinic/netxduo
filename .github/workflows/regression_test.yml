# This is a basic workflow that is manually triggered

name: regression_test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # NetX Duo, the 32-bit suite, runs as shards of at most four profiles.  As
  # one job its 43 configurations no longer fit the 60 minute test step on
  # every runner: netx_rtcp_basic_test spins on ThreadX ticks and takes about
  # 300 s instead of 6 s where the timer thread is starved (2026-10-03), which
  # makes a v4 configuration about 325 s.  scripts/ci/netxduo_shards.py derives
  # the shards from BUILD_CONFIGURATIONS; _test-suite.yml runs each; the
  # NetXDuo job below is the one check that stands for the suite.
  NetXDuo_plan:
    name: NetXDuo / plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - name: Check out the shard planner
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Derive the shards from BUILD_CONFIGURATIONS
      id: plan
      run: |
        set -euo pipefail
        python3 scripts/tests/test_netxduo_shards.py
        python3 scripts/ci/netxduo_shards.py plan --github-output "${GITHUB_OUTPUT}"

  NetXDuo_shards:
    needs: NetXDuo_plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.NetXDuo_plan.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_test-suite.yml
    with:
      suite: netxduo
      profiles: ${{ matrix.profiles }}
      result_name: ${{ matrix.result_name }}
      upload_coverage: true
      # Every configuration instrumented, as the single job had it, so the
      # union below is the same coverage figure.
      tx_coverage: true
      # Four profiles at the slow rate: 4 x 360 s = 24 minutes.
      test_timeout_minutes: 45

  # The aggregate, and the check that stands for the suite under the name the
  # single job had.  It fails on a failed, cancelled or skipped shard, on a
  # plan that is not the one BUILD_CONFIGURATIONS gives, and on any profile
  # that did not come back exactly once with its CTest summary, JUnit report
  # and coverage tracefile.  The coverage floor applies to the union.
  NetXDuo:
    name: NetXDuo / run_tests
    needs:
      - NetXDuo_plan
      - NetXDuo_shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
    - name: Check out the repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Download every shard's results and coverage
      if: ${{ needs.NetXDuo_plan.result == 'success' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: NetXDuo-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: shard_artifacts

    - name: Require every profile exactly once, with every report
      env:
        MATRIX: ${{ needs.NetXDuo_plan.outputs.matrix }}
      run: |
        set -euo pipefail
        python3 scripts/ci/netxduo_shards.py check \
            --matrix "${MATRIX}" \
            --artifacts shard_artifacts \
            --run-suffix "${{ github.run_id }}-${{ github.run_attempt }}" \
            --coverage-out test/cmake/netxduo/coverage_report \
            --junit-out junit

    - name: Publish Test Results
      if: ${{ !cancelled() }}
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
      with:
        check_name: Test Results NetXDuo
        files: junit/*.xml

    - name: Install gcovr
      timeout-minutes: 10
      run: ./scripts/install.sh

    - name: Merge the shards' coverage
      run: test/cmake/netxduo/coverage.sh --merge

    - name: Generate Code Coverage Results Summary
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: test/cmake/netxduo/coverage_report/merged.xml
        format: markdown
        badge: true
        hide_complexity: true
        output: file
        thresholds: '50 75'
        fail_below_min: true

    - name: Write Code Coverage Summary
      if: ${{ !cancelled() }}
      run: |
        echo "## Coverage Report NetXDuo" >> "${GITHUB_STEP_SUMMARY}"
        cat code-coverage-results.md >> "${GITHUB_STEP_SUMMARY}"

    - name: Create CheckRun for Code Coverage
      if: ${{ !cancelled() && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch') || (github.event.pull_request.head.repo.full_name == github.repository)) }}
      uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: Code Coverage NetXDuo
        conclusion: ${{ job.status }}
        output: |
          {"summary":"Coverage Report"}
        output_text_description_file: code-coverage-results.md

    - name: Add Code Coverage PR Comment
      if: ${{ !cancelled() && ((github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository)) }}
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: Code Coverage NetXDuo
        path: code-coverage-results.md

    - name: Require the plan and every shard to have succeeded
      if: ${{ always() }}
      run: |
        set -euo pipefail
        echo "plan: ${{ needs.NetXDuo_plan.result }}, shards: ${{ needs.NetXDuo_shards.result }}"
        test "${{ needs.NetXDuo_plan.result }}" = success
        test "${{ needs.NetXDuo_shards.result }}" = success
  Web:
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      pages: write
      id-token: write
    uses: ./.github/workflows/regression_template.yml
    with:
      build_script: ./scripts/build_web.sh
      test_script: ./scripts/test_web.sh
      cmake_path: ./test/cmake/web
      result_affix: Web
      skip_deploy: true
  PTP:
    permissions:
      contents: read
      issues: read
      checks: write
